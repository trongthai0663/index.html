<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Element selector -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Class selector -->
    <p class="description">
        Xin chào! Tôi là một lập trình viên web tương lai. Tôi thích sáng tạo các trang web đẹp và hữu ích.
    </p>

    <h2>Sở thích của tôi</h2>
    <!-- List với class selector -->
    <ul class="hobby-list">
        <li class="hobby-item item-1">Đọc sách công nghệ</li>
        <li class="hobby-item item-2">Lập trình web</li>
        <li class="hobby-item item-3">Chơi thể thao</li>
    </ul>

    <!-- Button với pseudo-class :hover -->
    <button class="btn-action">Nhấn vào đây</button>

</body>
</html>
