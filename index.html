<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ID Selector: Căn giữa tiêu đề -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Class Selector: Đoạn văn mô tả -->
    <p class="about-me">
        Xin chào! Tôi là một học viên lập trình Web. Tôi rất thích sáng tạo các sản phẩm công nghệ có giao diện đẹp mắt và thân thiện với người dùng.
    </p>

    <h2>Sở thích của tôi</h2>

    <!-- Class Selector: Danh sách sở thích -->
    <ul class="hobby-list">
        <li class="hobby-item item-read">Đọc sách công nghệ</li>
        <li class="hobby-item item-code">Lập trình web</li>
        <li class="hobby-item item-sport">Chơi thể thao</li>
    </ul>

    <!-- Pseudo-class Selector: Nút bấm có hiệu ứng hover -->
    <button class="btn-click">Nhấn vào đây</button>

</body>
</html>
